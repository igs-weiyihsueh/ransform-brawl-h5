<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>招式編輯器 — 變身大亂鬥 H5</title>
    <style>
      :root {
        --bg: #1a1a2e; --panel: #23233a; --panel2: #2c2c48; --line: #3a3a5c;
        --text: #e6e6f0; --muted: #9a9ab5; --accent: #6c8cff; --danger: #ff6c7a; --ok: #59d98e;
        --stage: #10101c; --hit: #ff9d5c; /* 判定形狀色 */
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text);
        font-family: Arial, "Microsoft JhengHei", "Noto Sans TC", sans-serif; font-size: 14px; }
      header { padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line);
        display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
      header h1 { font-size: 16px; margin: 0; } header .spacer { flex: 1; }
      .badge { font-size: 11px; color: var(--muted); border: 1px solid var(--line); padding: 1px 6px; border-radius: 10px; }
      button { background: var(--panel2); color: var(--text); border: 1px solid var(--line);
        border-radius: 6px; padding: 6px 10px; cursor: pointer; font-size: 13px; }
      button:hover { border-color: var(--accent); } button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      button:disabled { opacity: 0.4; cursor: not-allowed; }
      select, input { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font-size: 13px; }
      .layout { display: flex; height: calc(100vh - 53px); }
      .col-list { width: 220px; border-right: 1px solid var(--line); padding: 12px; background: var(--panel); overflow-y: auto; }
      .stage-wrap { flex: 1; display: flex; align-items: center; justify-content: center; background: #14141f; overflow: auto; }
      #preview { background: var(--stage); outline: 1px solid var(--line); }
      .col-inspector { width: 330px; border-left: 1px solid var(--line); padding: 12px; overflow-y: auto; background: var(--panel); }
      .section-title { color: var(--muted); font-size: 12px; text-transform: uppercase; margin: 10px 0 8px; letter-spacing: 0.5px; }
      .list-item { padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; margin-bottom: 6px; cursor: pointer; background: var(--panel2); display: flex; align-items: center; gap: 8px; }
      .list-item.selected { border-color: var(--accent); background: #34345a; }
      .list-item .grow { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; }
      .tab { padding: 5px 8px; font-size: 12px; }
      .tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
      .row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
      .row label { width: 128px; color: var(--muted); }
      .row input, .row select { flex: 1; }
      .row .val { width: 50px; text-align: right; color: var(--muted); }
      #status { padding: 8px 16px; font-size: 13px; white-space: pre-wrap; border-top: 1px solid var(--line); background: var(--panel); max-height: 120px; overflow-y: auto; }
      .status-ok { color: var(--ok); } .status-err { color: var(--danger); }
      .hint { color: var(--muted); font-size: 12px; margin-top: 4px; }
    </style>
  </head>
  <body>
    <header>
      <h1>招式編輯器</h1>
      <span class="badge" id="schema-version"></span>
      <button id="btn-undo" title="復原 (Ctrl+Z)" disabled>↶ 復原</button>
      <button id="btn-redo" title="重做 (Ctrl+Y)" disabled>↷ 重做</button>
      <div class="spacer"></div>
      <button id="btn-load-default">載入預設</button>
      <button id="btn-load-file">載入 JSON 檔…</button>
      <input id="file-input" type="file" accept="application/json,.json" hidden />
      <button id="btn-reset">重設為預設值</button>
      <button id="btn-export" class="primary">驗證並下載 JSON</button>
    </header>

    <div class="layout">
      <div class="col-list">
        <div class="section-title">角色</div>
        <div id="char-list"></div>
        <button id="btn-add-char" style="width:100%; margin-top:6px;">+ 新增角色（複製選中）</button>
        <div class="section-title">招式</div>
        <div id="skill-tabs" class="tabs"></div>
      </div>

      <div class="stage-wrap">
        <canvas id="preview" width="620" height="620"></canvas>
      </div>

      <div class="col-inspector">
        <div class="section-title">角色設定</div>
        <div id="char-inspector"></div>
        <div class="section-title">招式判定（AttackData）</div>
        <div id="skill-inspector"><div class="hint">選一個招式以編輯。</div></div>
      </div>
    </div>

    <div id="status">就緒。左側選角色→選招式，右側調數值，中間即時預覽判定形狀（含扇形）。</div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
