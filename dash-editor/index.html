<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>衝刺編輯器 — 變身大亂鬥 H5</title>
    <style>
      :root {
        --bg: #1a1a2e; --panel: #23233a; --panel2: #2c2c48; --line: #3a3a5c;
        --text: #e6e6f0; --muted: #9a9ab5; --accent: #6c8cff; --danger: #ff6c7a; --ok: #59d98e;
        --stage: #10101c;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text);
        font-family: Arial, "Microsoft JhengHei", "Noto Sans TC", sans-serif; font-size: 14px; }
      header { padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line);
        display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
      header h1 { font-size: 16px; margin: 0; } header .spacer { flex: 1; }
      .badge { font-size: 11px; color: var(--muted); border: 1px solid var(--line); padding: 1px 6px; border-radius: 10px; }
      button { background: var(--panel2); color: var(--text); border: 1px solid var(--line);
        border-radius: 6px; padding: 6px 10px; cursor: pointer; font-size: 13px; }
      button:hover { border-color: var(--accent); } button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      select, input { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font-size: 13px; }
      .layout { display: flex; height: calc(100vh - 53px); }
      .stage-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #14141f; overflow: auto; gap: 6px; }
      #preview { background: var(--stage); outline: 1px solid var(--line); }
      .col-inspector { width: 360px; border-left: 1px solid var(--line); padding: 12px; overflow-y: auto; background: var(--panel); }
      .section-title { color: var(--muted); font-size: 12px; text-transform: uppercase; margin: 10px 0 8px; letter-spacing: 0.5px; }
      .row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
      .row label { width: 150px; color: var(--muted); }
      .row input[type=range] { flex: 1; }
      .row input[type=number] { width: 74px; text-align: right; }
      #status { padding: 8px 16px; font-size: 13px; white-space: pre-wrap; border-top: 1px solid var(--line); background: var(--panel); max-height: 120px; overflow-y: auto; }
      .status-ok { color: var(--ok); } .status-err { color: var(--danger); }
      .hint { color: var(--muted); font-size: 12px; margin-top: 4px; }
      .dist { font-size: 13px; color: var(--text); margin-top: 8px; }
      .dist b { color: var(--accent); }
    </style>
  </head>
  <body>
    <header>
      <h1>衝刺編輯器</h1>
      <span class="badge" id="schema-version"></span>
      <div class="spacer"></div>
      <button id="btn-load-default">載入預設</button>
      <button id="btn-load-file">載入 JSON 檔…</button>
      <input id="file-input" type="file" accept="application/json,.json" hidden />
      <button id="btn-reset">重設為預設值</button>
      <button id="btn-export" class="primary">驗證並下載 JSON</button>
      <button id="btn-apply" class="primary" title="驗證後存入瀏覽器，重開遊戲即生效">套用到遊戲</button>
      <button id="btn-apply-return" class="primary" title="套用並立即返回遊戲">套用並回到遊戲</button>
      <button id="btn-clear-apply" title="移除套用，遊戲回打包預設">清除套用</button>
    </header>

    <div class="layout">
      <div class="stage-wrap">
        <canvas id="preview" width="640" height="360"></canvas>
        <div style="font-size:12px;color:#9a9ab5;display:flex;align-items:center;gap:8px;width:640px;">
          <span>放大檢視</span>
          <input id="preview-zoom" type="range" min="1" max="6" step="0.5" value="1" style="flex:1;" />
          <span id="preview-zoom-val">1×</span>
          <span>（1×＝完整場景真實比例）</span>
        </div>
        <div class="dist" id="dist-label"></div>
      </div>

      <div class="col-inspector">
        <div class="section-title">衝刺參數（Dash）</div>
        <div id="dash-inspector"></div>
        <div class="hint">距離 = 速度 × 持續時間（unit）。調完按「套用到遊戲」，重開遊戲即生效。</div>
      </div>
    </div>

    <div id="status">就緒。右側調衝刺參數，中間預覽衝刺距離（角色參照 + 真實比例）。</div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
