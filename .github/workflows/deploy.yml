# 自動部署到 GitHub Pages。
# 每次 push 到 main → 安裝相依 → build → 把 dist/ 發佈到 GitHub Pages。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 允許在 Actions 分頁手動觸發
  workflow_dispatch:

# 授予 workflow 部署 Pages 所需的權限
permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署；新的 push 進來會取代排隊中的舊部署（但不中斷進行中的）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
